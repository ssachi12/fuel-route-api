<!doctype html>
<html><head><meta charset="utf-8"><title>Route map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>html,body,#map{height:100%;margin:0}</style></head>
<body><div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
fetch("{{ api_url|escapejs }}").then(r => r.json()).then(d => {
  const map = L.map('map');
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {attribution: '© OpenStreetMap contributors'}).addTo(map);
  const line = L.geoJSON(d.route).addTo(map);
  map.fitBounds(line.getBounds());
  L.marker([d.start.lat, d.start.lng]).addTo(map).bindPopup("Start: " + d.start.query);
  L.marker([d.finish.lat, d.finish.lng]).addTo(map).bindPopup("Finish: " + d.finish.query);
  d.fuel_stops.forEach(s => L.circleMarker([s.lat, s.lng], {radius: 8, color: 'red'}).addTo(map)
    .bindPopup(`<b>${s.name}</b><br>${s.city}, ${s.state}<br>$${s.price_per_gallon}/gal<br>` +
               `${s.gallons} gal = $${s.cost}`));
});
</script></body></html>
